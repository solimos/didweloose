<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Did We Loose Dad</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(145deg, #0d0d0d, #1a1a1a);
            color: #fff;
            font-family: 'Arial Black', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            overflow: hidden;
        }

        .container {
            max-width: 800px;
            padding: 30px;
        }

        .logo {
            width: 140px;
            height: 140px;
            background-color: #111;
            border-radius: 20px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px #f03c6c66;
        }

        .logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 16px;
        }

        .headline {
            font-size: 56px;
            font-weight: bold;
            margin: 10px 0;
            color: #f03c6c;
            text-transform: uppercase;
        }

        .subline {
            font-size: 20px;
            color: #ccc;
            font-weight: 500;
            margin-bottom: 40px;
            font-style: italic;
        }

        .quote {
            font-size: 18px;
            margin: 12px 0;
            color: #ffdee9;
            font-weight: 400;
        }

        .btn {
            margin-top: 40px;
            padding: 16px 36px;
            background: #f03c6c;
            color: #000;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            text-decoration: none;
            box-shadow: 0 0 20px #f03c6c99;
            transition: all 0.3s ease-in-out;
        }

        .btn:hover {
            transform: scale(1.07);
            background: #ff5e88;
            box-shadow: 0 0 25px #ff5e8899;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="logo">
            <img src="./dadrugged.png" alt="Dad Rugged">
        </div>

        <h1 class="headline">Did We Loose Dad</h1>
        <h2 class="subline">📉 He said he was going to get milk... but bought the top.</h2>

        <p class="quote">“He was bullish... then he vanished.”</p>
        <p class="quote">“All-in at ATH. No stops. Just vibes.”</p>
        <p class="quote">“We never sold. He never came back.”</p>
        <p class="quote">“We didn't lose him... the market did.”</p>
        <p class="quote">“Coping? Yes. Hoping? Also yes.”</p>

        <a class="btn" href="https://pump.fun" target="_blank" rel="noopener">Find Dad on Pump.fun</a>
    </div>
</body>

</html>
